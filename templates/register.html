<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – AI Smart EV</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">⚡ AI Smart EV</div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">You can add up to 2 face scans after registering.</p>

    <form id="reg-form" autocomplete="off">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="choose a username" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="min 6 characters" required/>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm" placeholder="repeat password" required/>
      </div>
      <button type="submit" class="btn btn-primary" id="reg-btn">Create Account</button>
    </form>

    <div id="reg-msg" class="auth-msg"></div>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign In</a>
    </div>
  </div>

  <script>
    document.getElementById("reg-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const confirm  = document.getElementById("confirm").value;
      const btn      = document.getElementById("reg-btn");
      const msgEl    = document.getElementById("reg-msg");

      if (password !== confirm) {
        showMsg("Passwords do not match.", "error"); return;
      }
      if (password.length < 6) {
        showMsg("Password must be at least 6 characters.", "error"); return;
      }

      btn.disabled    = true;
      btn.textContent = "Creating…";

      try {
        const res  = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          showMsg("✅ Account created! Redirecting to login…", "success");
          setTimeout(() => window.location.href = "/login", 1500);
        } else {
          showMsg(data.message, "error");
          btn.disabled    = false;
          btn.textContent = "Create Account";
        }
      } catch (err) {
        showMsg("Network error.", "error");
        btn.disabled    = false;
        btn.textContent = "Create Account";
      }
    });

    function showMsg(text, type) {
      const el    = document.getElementById("reg-msg");
      el.textContent = text;
      el.className   = "auth-msg " + type;
    }
  </script>
</body>
</html>
